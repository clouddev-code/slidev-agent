version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            - cd web
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - cd web
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - cd web
            - npm run build
      artifacts:
        baseDirectory: web/.next
        files:
          - '**/*'
      cache:
        paths:
          - web/.npm/**/*
          - web/node_modules/**/*
          - web/.next/cache/**/*
